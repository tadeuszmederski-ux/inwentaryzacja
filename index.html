<title>Inwentaryzacja energetyczna</title>
<style>
:root{--tlo:#fff;--tekst:#000;--glowny:#0b3d91;--glowny2:#062a66;--ramka:#555;--wym:#d35400;--brak:#ffe3e8;--ok:#0a7a2f;--szary:#e9e9e9;--ostrz:#b00020}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--tlo);color:var(--tekst);font:18px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body.modal-otwarty{overflow:hidden}
header{position:sticky;top:0;z-index:5;background:var(--glowny);color:#fff;display:flex;align-items:center;gap:8px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top))}
header h1{font-size:19px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{background:#fff;color:var(--glowny);min-height:44px;min-width:44px;border:0;border-radius:8px;font-weight:700;font-size:17px}
#stan-zapisu{font-size:13px;opacity:.95;white-space:nowrap}
main{padding:10px 12px 90px;max-width:900px;margin:0 auto}
footer{font-size:13px;color:#333;text-align:center;padding:12px 12px 40px;border-top:1px solid #ccc;max-width:900px;margin:0 auto}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;min-height:52px;margin:8px 0;padding:10px 14px;border:2px solid var(--glowny);border-radius:10px;background:var(--glowny);color:#fff;font-weight:700;font-size:18px;text-align:left}
.btn.jasny{background:#fff;color:var(--glowny)}
.btn.ostrz{background:#fff;color:var(--ostrz);border-color:var(--ostrz)}
.btn.maly{display:inline-block;width:auto;min-height:44px;margin:4px 4px 4px 0;font-size:16px;text-align:center}
.btn small{display:block;font-weight:400;font-size:14px;opacity:.9}
.kafel{display:flex;justify-content:space-between;align-items:center;gap:8px}
.znacz{font-size:14px;font-weight:700;border-radius:12px;padding:2px 8px;background:#fff;color:var(--ok);border:2px solid var(--ok);white-space:nowrap}
.znacz.brakuje{color:var(--wym);border-color:var(--wym)}
h2{font-size:21px;margin:14px 0 6px}
h3{font-size:19px;margin:10px 0 4px}
.opis{background:#f3f6fb;border-left:5px solid var(--glowny);padding:8px 10px;margin:6px 0 10px;font-size:16px}
.pole{margin:8px 0 12px;padding-left:8px;border-left:5px solid transparent}
.pole.wym{border-left-color:var(--wym)}
.pole label{display:block;font-weight:600;font-size:16px;margin-bottom:3px}
.pole.wym label{font-weight:800}
.j{font-weight:400;color:#333}
.gw{color:var(--wym)}
.wiersz-pola{display:flex;gap:6px;align-items:stretch;position:relative}
input,select,textarea{font:inherit;font-size:18px;width:100%;min-height:48px;padding:8px 10px;border:2px solid var(--ramka);border-radius:8px;background:#fff;color:#000}
textarea{min-height:80px}
input:focus,select:focus,textarea:focus{outline:3px solid #ffbf00;outline-offset:1px}
.pole.brak input,.pole.brak select,.pole.brak textarea{background:var(--brak)}
.pyt{min-width:48px;border:2px solid var(--glowny);background:#fff;color:var(--glowny);border-radius:8px;font-weight:800;font-size:20px}
.pomoc{background:#fffbe6;border:1px solid #d8c36a;border-radius:8px;padding:8px;margin-top:4px;font-size:15px}
.karta{border:2px solid #999;border-radius:12px;padding:8px 10px;margin:10px 0;background:#fafafa}
.karta>.tyt{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:800;font-size:18px}
.karta .pod{border-top:1px dashed #999;margin-top:6px;padding-top:6px}
.wyl{font-weight:700;background:#eef7ee;border-radius:8px;padding:6px 8px;margin:6px 0;font-size:16px}
.auto-lista{position:absolute;left:0;right:54px;top:100%;z-index:20;background:#fff;border:2px solid var(--glowny);border-radius:8px;max-height:300px;overflow:auto;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.auto-lista div{padding:10px;border-bottom:1px solid #ddd;font-size:16px}
.auto-lista div small{color:#444}
.auto-lista div:active{background:#dde7f7}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.okno-modal{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.okno-modal h2{margin-top:2px}
.przyciski-modal{display:flex;flex-wrap:wrap;gap:6px;position:sticky;bottom:0;background:#fff;padding-top:6px}
.przyciski-modal button{flex:1 1 40%;min-height:52px;border-radius:10px;border:2px solid var(--glowny);background:#fff;color:var(--glowny);font-weight:700;font-size:17px}
.przyciski-modal button.gl{background:var(--glowny);color:#fff}
.przyciski-modal button.us{color:var(--ostrz);border-color:var(--ostrz)}
.info{font-weight:700;margin:6px 0;white-space:pre-line}
.multi label{display:flex;align-items:center;gap:8px;font-weight:400;min-height:44px}
.multi input{width:28px;min-height:28px}
.siatka-zdj{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.siatka-zdj figure{margin:0;border:2px solid #999;border-radius:8px;overflow:hidden;background:#eee}
.siatka-zdj img{width:100%;height:120px;object-fit:cover;display:block}
.siatka-zdj figcaption{font-size:14px;padding:4px 6px;background:#fff}
.lista-k{list-style:none;padding:0;margin:0}
.lista-k li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #ddd}
.lista-k input{width:30px;min-height:30px}
.lista-k .ile{margin-left:auto;font-size:14px}
.ostrzezenie{background:#fff0f0;border:2px solid var(--ostrz);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:16px}
#pasek-trwalosci{background:var(--ostrz);color:#fff;padding:8px 12px;font-weight:700}
.narz{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.narz button{min-height:46px;min-width:46px;padding:4px 10px;border:2px solid var(--glowny);border-radius:8px;background:#fff;color:var(--glowny);font-weight:700;font-size:16px}
.narz button.akt{background:var(--glowny);color:#fff}
#plotno-szkicu{width:100%;height:62vh;border:2px solid #333;border-radius:8px;touch-action:none;background:#fff;display:block}
#przegladarka{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
#przegladarka[hidden]{display:none}
#przegladarka .gora,#przegladarka .dol{background:#111;color:#fff;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#przegladarka .gora{padding-top:max(6px,env(safe-area-inset-top))}
#przegladarka .dol{padding-bottom:max(6px,env(safe-area-inset-bottom))}
#przegladarka button{min-height:50px;min-width:50px;padding:4px 10px;border:2px solid #fff;border-radius:10px;background:#111;color:#fff;font-weight:700;font-size:16px}
#przegladarka button.akt{background:#ffbf00;color:#000;border-color:#ffbf00}
#przegladarka .tyt{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#plotno-zdj{flex:1;width:100%;touch-action:none;display:block}
#podpowiedz-zdj{color:#ffbf00;font-size:15px;width:100%}
table.tab{border-collapse:collapse;width:100%;font-size:15px;margin:6px 0}
table.tab td,table.tab th{border:1px solid #888;padding:4px 6px;text-align:left;vertical-align:top}
.ukryty{display:none!important}
</style>
</head>

/* ===================================================================== narzędzia */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function dzis() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function liczba(v) { if (v == null) return null; const s = String(v).replace(/\s/g, '').replace(',', '.'); if (s === '') return null; const x = Number(s); return isFinite(x) ? x : null; }
function fmt(x, d = 2) { return (x == null || !isFinite(x)) ? '' : x.toFixed(d).replace('.', ','); }
function pusty(v) { return v == null || String(v).trim() === ''; }
function norm(s) { return String(s || '').toLowerCase().replace(/ł/g, 'l').normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function bezpieczna(s, n = 50) { return String(s || '').replace(/[\\/:*?"<>|\r\n\t]+/g, '-').replace(/\s+/g, ' ').trim().slice(0, n); }
function pad2(n) { return String(n).padStart(2, '0'); }

/* ===================================================================== magazyn (IndexedDB, rezerwa w pamięci) */
const DB = {
  db: null, trwaly: false, pam: {projekty: new Map(), zdjecia: new Map(), ustawienia: new Map()},
  async otworz() {
    try {
      if (!window.indexedDB) throw new Error('brak IndexedDB');
      this.db = await new Promise((res, rej) => {
        setTimeout(() => rej(new Error('pamięć przeglądarki nie odpowiada')), 10000);
        const r = indexedDB.open('inwentaryzacja_energetyczna', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          if (!d.objectStoreNames.contains('projekty')) d.createObjectStore('projekty', {keyPath: 'id'});
          if (!d.objectStoreNames.contains('zdjecia')) d.createObjectStore('zdjecia', {keyPath: 'id'});
          if (!d.objectStoreNames.contains('ustawienia')) d.createObjectStore('ustawienia', {keyPath: 'id'});
        };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      });
      this.trwaly = true;
      try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) { /* brak */ }
    } catch (e) { this.db = null; this.trwaly = false; }
  },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode); const r = fn(tx.objectStore(store)); let w;
      if (r) r.onsuccess = () => { w = r.result; };
      tx.oncomplete = () => res(w); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  async wszystkie(st) { return this.db ? this._tx(st, 'readonly', s => s.getAll()) : Array.from(this.pam[st].values()); },
  async daj(st, k) { return this.db ? this._tx(st, 'readonly', s => s.get(k)) : this.pam[st].get(k); },
  async zapisz(st, o) { if (!this.db) { this.pam[st].set(o.id, o); return; } return this._tx(st, 'readwrite', s => s.put(o)); },
  async usun(st, k) { if (!this.db) { this.pam[st].delete(k); return; } return this._tx(st, 'readwrite', s => s.delete(k)); },
  async wyczysc() { for (const st of ['projekty', 'zdjecia', 'ustawienia']) { if (!this.db) this.pam[st].clear(); else await this._tx(st, 'readwrite', s => s.clear()); } }
};
/* zdjęcia przechowywane jako ArrayBuffer (zgodność z Safari) */
async function zapiszBlob(id, projekt, blob) { await DB.zapisz('zdjecia', {id, projekt, typ: blob.type || 'image/jpeg', dane: await blob.arrayBuffer()}); }
async function dajBlob(id) { const r = await DB.daj('zdjecia', id); return r ? new Blob([r.dane], {type: r.typ}) : null; }
const URLE = new Map();
async function urlZdjecia(id) { if (URLE.has(id)) return URLE.get(id); const b = await dajBlob(id); if (!b) return ''; const u = URL.createObjectURL(b); URLE.set(id, u); return u; }

const S = {P: null, ust: {}, timer: null};
function stanZapisu(s) { const el = $('#stan-zapisu'); if (el) { el.textContent = t(s); el.style.color = s === 'blad_zapisu' ? '#ffbf00' : ''; } }
function zmiana() { if (!S.P) return; S.P.zmieniono = new Date().toISOString(); clearTimeout(S.timer); stanZapisu('zapisywanie'); S.timer = setTimeout(zapiszProjekt, 400); }
async function zapiszProjekt() {
  clearTimeout(S.timer); S.timer = null; if (!S.P) return;
  try { await DB.zapisz('projekty', JSON.parse(JSON.stringify(S.P))); stanZapisu('zapisano'); } catch (e) { stanZapisu('blad_zapisu'); console.error(e); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && S.timer) zapiszProjekt(); });

function nowyProjekt(nazwa, rodzaj, cp) {
  const P = {id: uid(), nazwa, rodzaj, cp: !!cp, utworzono: new Date().toISOString(), zmieniono: new Date().toISOString(),
    pola: {'budynek.nazwa': nazwa, 'wizja.data': dzis()}, tabele: {}, szkice: [], zdjecia: [], lista: {}, licznik_zdjec: 0};
  if (S.ust.imie) P.pola['sporzadzajacy.imie_nazwisko'] = S.ust.imie;
  uzupelnijProjekt(P); return P;
}
function uzupelnijProjekt(P) {
  P.tabele = P.tabele || {}; P.pola = P.pola || {}; P.szkice = P.szkice || []; P.zdjecia = P.zdjecia || []; P.lista = P.lista || {};
  for (const s of DEF.sekcje) if (s.tabela) P.tabele[s.tabela.klucz] = P.tabele[s.tabela.klucz] || [];
  for (const z of P.zdjecia) z.adnotacje = z.adnotacje || [];
  return P;
}

/* ===================================================================== definicje: widoczność, wymagalność, listy */
function sekcjeWidoczne(P) { return DEF.sekcje.filter(s => s.rodzaje.includes(P.rodzaj) && (!s.cp || P.cp)); }
function czyAudyt(P) { return DEF.audyty.includes(P.rodzaj); }
function wymagane(p, P) { const w = p.wym || []; return w.includes(P.rodzaj) || (P.cp && czyAudyt(P) && w.includes(P.rodzaj + '+cp')); }
function tabela(k) { const s = DEF.sekcje.find(s => s.tabela && s.tabela.klucz === k); return s ? s.tabela : null; }
function opcje(l, P) {
  if (l === '@przegrody') return P.tabele.przegrody.filter(r => r.symbol).map(r => ({v: r.symbol, et: r.symbol + (r.typ ? ' – ' + r.typ : '')}));
  if (l === '@sciany') return P.tabele.sciany.map(r => ({v: r._id, et: (r.nr || '?') + (r.orientacja ? ' (' + r.orientacja + ')' : '')}));
  if (l === '@nieogrzewane') return P.tabele.nieogrzewane.filter(r => r.nazwa).map(r => ({v: r.nazwa, et: r.nazwa}));
  return (DEF.listy[l] || []).map(v => ({v: String(v), et: l === 'nosniki' ? String(v).replace(/_/g, ' ') : String(v)}));
}
function pozycjeAuto(l, P) {
  if (DEF.biblioteka[l]) return DEF.biblioteka[l].map(w => ({v: w[0], et: w[0], op: w[2] || ''}));
  return opcje(l, P).map(o => ({v: o.v, et: o.et, op: ''}));
}
function etykietaWartosci(p, v, P) {
  if (pusty(v)) return '';
  if (p.l && p.l[0] === '@') { const o = opcje(p.l, P).find(o => o.v === v); return o ? o.et : v; }
  return v;
}

/* ===================================================================== geometria wspólna */
const SEKTORY = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
function sektor(az) { az = ((az % 360) + 360) % 360; return SEKTORY[Math.round(az / 45) % 8]; }
function polePrzekroju(r) { const s = liczba(r.szer_cm), w = liczba(r.wys_cm); return (s && w) ? s * w / 1e4 : null; }
function oknaSciany(P, sid) { return P.tabele.okna.filter(o => o.sciana === sid); }
function bilansSciany(P, r) {
  const dl = liczba(r.dlugosc_cm), wy = liczba(r.wysokosc_cm);
  const br = (dl && wy) ? dl * wy / 1e4 : null;
  let ok = 0; for (const o of oknaSciany(P, r._id)) { const a = polePrzekroju(o); if (a) ok += a * (liczba(o.szt) || 1); }
  return {brutto: br, okna: ok, netto: br == null ? null : br - ok};

  if (zAdnotacjami) for (let i = 0; i < D.szkice.length; i++) { if (!D.szkice[i].sciany.length) continue; const b = await pngSzkicu(P.szkice[i], P); if (b) pliki.push({nazwa: prefiks + D.szkice[i].plik_png, dane: b}); pliki.push({nazwa: prefiks + D.szkice[i].plik_png.replace(/\.png$/, '.json'), dane: JSON.stringify(D.szkice[i], null, 1)}); }

function naglowekPakietu(typ) { return {format: APP.format, wersja_formatu: DEF.wersja_formatu, typ, aplikacja: 'Inwentaryzacja energetyczna ' + APP.wersja, eksport: new Date().toISOString()}; }

async function importujPlik(f) {
  const pl = await czytajZip(f); const dek = u => JSON.parse(new TextDecoder().decode(u)); const wczytane = [];

    const d = dek(pl[prefiks + 'dane.json']); if (d.format !== APP.format) throw new Error('nieznany format pliku');

    for (const z of P.zdjecia) { const u8 = pl[prefiks + z.plik]; if (u8) await zapiszBlob(z.id, P.id, new Blob([u8], {type: 'image/jpeg'})); delete z.plik; delete z.plik_adnotacje; delete z._stare; }

    await DB.zapisz('projekty', P); wczytane.push(P.nazwa);

}

function csvWiersz(w) { return w.map(v => { const s = v == null ? '' : String(v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';'); }
function csv(P, co) {
  const L = [];
  if (co === 'okna') { L.push(['Nr', 'Rodzaj', 'Typ', 'Szerokość [cm]', 'Wysokość [cm]', 'Sztuk', 'Pole 1 szt. [m2]', 'Pole razem [m2]', 'Ściana', 'Orientacja', 'Szyby', 'Rok', 'Stan', 'U', 'Nawiewnik', 'Uwagi']); for (const o of P.tabele.okna) { const a = polePrzekroju(o), n = liczba(o.szt) || 1; const s = P.tabele.sciany.find(x => x._id === o.sciana); L.push([o.nr, o.rodzaj, o.typ, o.szer_cm, o.wys_cm, o.szt, fmt(a), fmt(a ? a * n : null), s ? s.nr : '', o.orientacja, o.szyby, o.rok, o.stan, o.U_znane, o.nawiewnik, o.uwagi]); } }
  if (co === 'sciany') { L.push(['Ściana', 'Orientacja', 'Długość [cm]', 'Wysokość [cm]', 'Brutto [m2]', 'Okna [m2]', 'Netto [m2]', 'Przegroda', 'Sąsiedztwo', 'Kondygnacja', 'Uwagi']); for (const s of P.tabele.sciany) { const b = bilansSciany(P, s); L.push([s.nr, s.orientacja, s.dlugosc_cm, s.wysokosc_cm, fmt(b.brutto), fmt(b.okna), fmt(b.netto), s.przegroda, s.sasiedztwo, s.kondygnacja, s.uwagi]); }
    P.szkice.forEach(k => k.sciany.forEach((s, i) => L.push([`szkic ${k.nazwa} ${i + 1}`, k.polnoc ? orientacjaScianySzkicu(s, k) : '', liczba(s.wymiar_cm) ? s.wymiar_cm : fmt(dlugoscScianyM(s, k) * 100, 0), k.wysokosc_cm, '', '', '', s.przegroda, s.sasiedztwo, k.nazwa, liczba(s.wymiar_cm) ? '' : 'długość z kratki']))); }
  if (co === 'przegrody') { L.push(['Symbol', 'Typ', 'Nazwa', 'Lp warstwy', 'Materiał (od zewnątrz)', 'Grubość [cm]', 'U z dokumentacji', 'Pole [m2]', 'Stan / źródło', 'Uwagi']); for (const r of P.tabele.przegrody) { const w = r.warstwy || []; if (!w.length) L.push([r.symbol, r.typ, r.nazwa, '', '', '', r.U_zadane, r.pole_m2, r.stan, '']); w.forEach((x, i) => L.push([r.symbol, i ? '' : r.typ, i ? '' : r.nazwa, i + 1, x.material, x.grubosc_cm, i ? '' : r.U_zadane, i ? '' : r.pole_m2, i ? '' : r.stan, x.uwagi])); } }
  return '﻿' + L.map(csvWiersz).join('\r\n') + '\r\n';
}
function braki(P) {
  const wyn = [];
  for (const s of sekcjeWidoczne(P)) {
    for (const p of s.pola || []) if (wymagane(p, P) && pusty(P.pola[p.k])) wyn.push(`${s.tytul}: ${p.et}`);
    if (s.tabela) P.tabele[s.tabela.klucz].forEach(r => { for (const p of s.tabela.kolumny) if (wymagane(p, P) && pusty(r[p.k])) wyn.push(`${s.tytul} – ${s.tabela.nazwa_wiersza} ${r[s.tabela.kolumny[0].k] || '?'}: ${p.et}`); });
  }
  if (!P.tabele.przegrody.length) wyn.push('Przegrody: brak przegród');
  if (!P.tabele.sciany.length && !P.szkice.some(k => k.sciany.length)) wyn.push('Ściany: brak ścian ze zdjęć i ze szkicu');
  for (const l of DEF.lista_zdjec) if (!P.zdjecia.some(z => z.lista === l.id) && !P.lista[l.id]) wyn.push('Zdjęcie: ' + l.nazwa);
  return wyn;
}

function blobNaDataUrl(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); }); }
async function raportHTML(P) {
  const rodz = (DEF.rodzaje.find(r => r.kod === P.rodzaj) || {}).nazwa || P.rodzaj;
  const tab = (nag, wiersze) => `<table><tr>${nag.map(n => `<th>${esc(n)}</th>`).join('')}</tr>${wiersze.map(w => `<tr>${w.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table>`;
  let h = '';
  for (const s of sekcjeWidoczne(P)) {
    let t2 = '';
    const pola = (s.pola || []).filter(p => !pusty(P.pola[p.k]));
    if (pola.length) t2 += tab(['Pole', 'Wartość'], pola.map(p => [p.et + (p.j ? ` [${p.j}]` : ''), etykietaWartosci(p, P.pola[p.k], P)]));
    if (s.tabela && P.tabele[s.tabela.klucz].length) {
      const kol = s.tabela.kolumny.filter(p => P.tabele[s.tabela.klucz].some(r => !pusty(r[p.k])));
      const ext = s.tabela.klucz === 'sciany' ? ['Brutto [m²]', 'Netto [m²]'] : s.tabela.klucz === 'okna' ? ['Pole razem [m²]'] : s.tabela.podtabela ? ['Warstwy od zewnątrz'] : [];
      t2 += tab(kol.map(p => p.et + (p.j ? ` [${p.j}]` : '')).concat(ext), P.tabele[s.tabela.klucz].map(r => {
        const w = kol.map(p => etykietaWartosci(p, r[p.k], P));
        if (s.tabela.klucz === 'sciany') { const b = bilansSciany(P, r); w.push(fmt(b.brutto), fmt(b.netto)); }
        if (s.tabela.klucz === 'okna') { const a = polePrzekroju(r); w.push(fmt(a ? a * (liczba(r.szt) || 1) : null)); }
        if (s.tabela.podtabela) w.push((r.warstwy || []).map((x, i) => `${i + 1}. ${x.material || '?'} – ${x.grubosc_cm || '?'} cm`).join('; '));
        return w;
      }));
    }
    if (t2) h += `<h2>${esc(s.tytul)}</h2>${t2}`;
  }
  for (const k of P.szkice) if (k.sciany.length) { const b = await pngSzkicu(k, P); h += `<h2>Szkic – ${esc(k.nazwa)}</h2><img class="szkic" alt="szkic" src="${await blobNaDataUrl(b)}">`; }
  if (P.zdjecia.length) {
    h += `<h2>Zdjęcia</h2>`;
    for (const z of P.zdjecia) { const b = z.adnotacje.length ? await obrazZAdnotacjami(z, P) : await dajBlob(z.id); if (!b) continue; h += `<figure><img alt="zdjęcie ${z.nr}" src="${await blobNaDataUrl(b)}"><figcaption>${z.nr}. ${esc(z.przypisanie || '')}${z.podpis ? ' – ' + esc(z.podpis) : ''}${z.adnotacje.length ? ` (oznaczeń: ${z.adnotacje.length})` : ''}</figcaption></figure>`; }
  }
  h += `<h2>Lista kontrolna zdjęć</h2><ul>${DEF.lista_zdjec.map(l => { const n = P.zdjecia.filter(z => z.lista === l.id).length; return `<li>${n || P.lista[l.id] ? '☑' : '☐'} ${esc(l.nazwa)}${n ? ` (${n})` : ''}</li>`; }).join('')}</ul>`;
  const b = braki(P); h += `<h2>Czego brakuje</h2>${b.length ? `<ul>${b.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p>Wszystkie pola obowiązkowe wypełnione.</p>'}`;
  return `<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:"><title>Raport z inwentaryzacji – ${esc(P.nazwa)}</title>
<style>body{font:14px/1.4 system-ui,Arial,sans-serif;margin:16px;color:#000;max-width:1000px}h1{font-size:22px}h2{font-size:17px;border-bottom:2px solid #0b3d91;margin-top:22px;page-break-after:avoid}table{border-collapse:collapse;width:100%;margin:6px 0}td,th{border:1px solid #888;padding:3px 5px;text-align:left;vertical-align:top;font-size:13px}th{background:#e8edf6}figure{margin:10px 0;page-break-inside:avoid}figure img,img.szkic{max-width:100%;max-height:900px;border:1px solid #888}figcaption{font-size:13px}.meta{color:#333}@media print{body{margin:0}}</style></head><body>
<h1>Raport z inwentaryzacji – ${esc(P.nazwa)}</h1><p class="meta">${esc(rodz)}${P.cp ? ' + Czyste Powietrze' : ''} · data wizji: ${esc(P.pola['wizja.data'] || '')} · wykonał: ${esc(P.pola['sporzadzajacy.imie_nazwisko'] || '')}${S.ust.uprawnienia ? ' (' + esc(S.ust.uprawnienia) + ')' : ''}</p>${h}
<p class="meta">Wygenerowano: ${esc(new Date().toLocaleString('pl-PL'))} · Inwentaryzacja energetyczna ${esc(APP.wersja)}. Wymiary z oznaczeń na zdjęciach – do sprawdzenia.</p></body></html>`;
}

/* ===================================================================== wersja www: service worker (offline) */
const SW_DOZWOLONY = 'serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname));
let SW_ODSWIEZ = false;
function pokazAktualizacje(reg) {
  const b = $('#pasek-aktualizacji'); if (!b) return; b.textContent = t('nowa_wersja'); b.hidden = false;
  b.onclick = async () => { SW_ODSWIEZ = true; if (S.timer) await zapiszProjekt(); if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING'); else location.reload(); };
}
if (SW_DOZWOLONY) {
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (SW_ODSWIEZ) location.reload(); });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', {scope: './'}).then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) pokazAktualizacje(reg);
      reg.addEventListener('updatefound', () => { const n = reg.installing; if (n) n.addEventListener('statechange', () => { if (n.state === 'installed' && navigator.serviceWorker.controller) pokazAktualizacje(reg); }); });
      setInterval(() => reg.update().catch(() => {}), 3600000);
    }).catch(() => {});
  });
}
window.sprawdzSW = () => SW_DOZWOLONY ? Promise.race([navigator.serviceWorker.ready.then(r => 'zarejestrowany: ' + r.scope), new Promise(r => setTimeout(() => r('brak (limit czasu)'), 8000))]) : Promise.resolve('niedostępny');

if (location.hash === '#autotest') autotest(); else start();

/* ===================================================================== autotest (przeglądarka bez interfejsu) */
async function autotest() {
  const W = {ok: [], bledy: []}; const sprawdz = (war, opis) => (war ? W.ok : W.bledy).push(opis);
  try {
    DB.db = null; DB.trwaly = false;
    sprawdz(crc32(new TextEncoder().encode('123456789')) === 0xCBF43926, 'crc32');
    const zip = await zbudujZip([{nazwa: 'a.txt', dane: 'zażółć gęślą jaźń'}, {nazwa: 'katalog/b.bin', dane: new Uint8Array([1, 2, 3])}]);
    const r = await czytajZip(zip); sprawdz(new TextDecoder().decode(r['a.txt']) === 'zażółć gęślą jaźń' && r['katalog/b.bin'].length === 3, 'zip zapis/odczyt');
    const P = nowyProjekt('Budynek testowy', 'audyt_energetyczny', true); S.P = P;
    P.tabele.przegrody.push({_id: 'p1', symbol: 'SZ1', typ: 'ściana zewnętrzna', warstwy: [{_id: 'w1', material: 'Mur z cegły ceramicznej pełnej', grubosc_cm: '38'}]});
    P.tabele.sciany.push({_id: 's1', nr: 'E1', orientacja: 'S', dlugosc_cm: '1050', wysokosc_cm: '520', przegroda: 'SZ1'});
    P.tabele.okna.push({_id: 'o1', nr: 'O1', rodzaj: 'okno', szer_cm: '150', wys_cm: '150', szt: '2', sciana: 's1'});
    const b = bilansSciany(P, P.tabele.sciany[0]); sprawdz(Math.abs(b.netto - 50.1) < 1e-9, 'bilans ściany netto 50,1');
    const k = nowaKondygnacja('Parter'); k.sciany = [{id: 'a', x1: 0, y1: 0, x2: 20, y2: 0}, {id: 'b', x1: 20, y1: 0, x2: 20, y2: 12}, {id: 'c', x1: 20, y1: 12, x2: 0, y2: 12}, {id: 'd', x1: 0, y1: 12, x2: 0, y2: 0}];
    sprawdz(['N', 'E', 'S', 'W'].join() === k.sciany.map(s => orientacjaScianySzkicu(s, k)).join(), 'orientacje ścian szkicu');
    P.szkice.push(k);
    const c = document.createElement('canvas'); c.width = 400; c.height = 300; const ctx = c.getContext('2d'); ctx.fillStyle = '#88a'; ctx.fillRect(0, 0, 400, 300);
    const jpg = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.8)); sprawdz(!!jpg && jpg.size > 0, 'canvas → JPEG');
    await zapiszBlob('z1', P.id, jpg);
    P.zdjecia.push({id: 'z1', nr: 1, w: 400, h: 300, lista: 'elewacja_S', przypisanie: 'Elewacja południowa (S)', podpis: '', adnotacje: [
      {id: 'a1', typ: 'sciana', pkt: [[.05, .1], [.95, .1], [.95, .9], [.05, .9]], sciana: 's1'}, {id: 'a2', typ: 'okno', r: [.2, .3, .15, .2], okno: 'o1'},
      {id: 'a3', typ: 'wymiar', a: [.05, .95], b: [.95, .95], cm: '1050', rodzaj: 'długość ściany', nalezy: 'sciana:s1'}]});
    const ad = await obrazZAdnotacjami(P.zdjecia[0], P); sprawdz(!!ad && ad.size > 0, 'zdjęcie z adnotacjami');
    const png = await pngSzkicu(k, P); sprawdz(!!png && png.size > 0, 'PNG szkicu');
    const rap = await raportHTML(P); sprawdz(rap.includes('Raport z inwentaryzacji') && rap.includes('data:image/jpeg') && rap.includes('50,10'), 'raport HTML');
    sprawdz(csv(P, 'okna').includes('O1;okno') && csv(P, 'sciany').includes('50,10'), 'CSV');
    const {D, pliki} = await plikiProjektu(P, '', true); sprawdz(pliki.length >= 3 && D.zdjecia[0].plik_adnotacje, 'pliki pakietu');
    const A = $('#aplikacja');
    widokListy(A); widokProjektu(A, P); for (const s of sekcjeWidoczne(P)) widokSekcji(A, P, s.id); widokEksportu(A, P); widokSzkicu(A, P); await widokZdjec(A, P);
    sprawdz(sekcjeWidoczne(P).length === DEF.sekcje.length, 'sekcje audytu + CP widoczne');
    sprawdz(braki(P).length > 0, 'lista braków');
  } catch (e) { W.bledy.push('wyjątek: ' + (e && e.stack || e)); }
  if (window.sprawdzSW) { try { W.sw = await window.sprawdzSW(); } catch (e) { W.sw = 'błąd: ' + e.message; } }
  const el = $('#autotest'); el.hidden = false; el.textContent = 'AUTOTEST ' + JSON.stringify(W);
}
